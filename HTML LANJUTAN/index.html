<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanjutan HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <tr>
            <th>Nama</th>
            <th>Prodi</th>
        </tr>
        <tr>
            <th>Agus</th>
            <th>Teknik Informatika</th>
        </tr>
    </table>
    <table>
        <tr>
            <th colspan="2">Identitas</th>
        </tr>
        <tr>
            <td colspan="2">Mahasiswa</td>
            <td>Nama</td>
        </tr>
    </table>
    <form>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama">
        <button type="submit">Kirim</button>
    </form>
    <input type="text">
    <input type="email">
    <input type="password">
    <input typr="number">
    <input type="date">

    <input type="radio">
    <input type="checkbox">

    <input type="email" required>
    <input type="number" min="1" max="100">
    <input type="text" minlength="3" maxlength="30">

    <header>Profil</header>
    <nav>Menu</nav>
    <main>
        <section>Data dan Tabel</section>
        <section>Form Kontak</section>
    </main>
    <footer>Kontak</footer>

    <audio controls>
        <source src="audio.mp3">
    </audio>

    <video controls>
        <source src="video.mp4">
    </video>

</body>
</html>
